name: Build and deploy Astro site

on:
  push:
    branches: [main, astro-proof-of-concept]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "deployment purpose (editorial write-back is not enabled yet)"
        required: true
        type: choice
        default: site
        options:
          - site
          - editorial

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: astro-site/package-lock.json
      - name: identify deployment purpose
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          echo "deployment purpose: $RELEASE_TYPE"
          if [ "$RELEASE_TYPE" = "editorial" ]; then
            echo "editorial release selected; Notion status write-back is not yet implemented"
          fi
      - run: npm ci
      - run: npm run test:publishing
      - run: npm run build
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: astro-site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
