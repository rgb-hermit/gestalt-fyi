name: Build and deploy Astro site

on:
  push:
    branches: [main, astro-proof-of-concept]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: astro-site/package-lock.json
      - run: npm ci
      - run: npm run test:publishing
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: astro-site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: actions/setup-node@v7
        if: github.event_name == 'push'
        with:
          node-version: "24"
      - name: acknowledge editorial release in Notion
        if: github.event_name == 'push'
        working-directory: astro-site
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          if [[ "$(git log -1 --format=%s)" == "chore(publishing): approve editorial snapshot" ]]; then
            node scripts/editorial-release.mjs acknowledge
          else
            echo "Ordinary site deployment: no editorial acknowledgement"
          fi
