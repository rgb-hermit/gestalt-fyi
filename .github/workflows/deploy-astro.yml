name: Build and deploy Astro site

on:
  push:
    branches: [main, astro-proof-of-concept]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      acknowledge_release_id:
        description: 'Recovery only: deployed editorial release ID to acknowledge'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: astro-site/package-lock.json
      - run: npm ci
      - run: npm run test:publishing
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: astro-site/dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7
        if: github.event_name == 'push' || inputs.acknowledge_release_id != ''
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        if: github.event_name == 'push' || inputs.acknowledge_release_id != ''
        with:
          node-version: "24"
      - name: classify deployed editorial release
        id: editorial
        if: github.event_name == 'push' || inputs.acknowledge_release_id != ''
        working-directory: astro-site
        env:
          RECOVERY_RELEASE_ID: ${{ inputs.acknowledge_release_id }}
        run: node scripts/release-trigger.mjs
      - name: acknowledge editorial release in Notion
        if: steps.editorial.outputs.acknowledge == 'true'
        working-directory: astro-site
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: node scripts/editorial-release.mjs acknowledge
      - name: report ordinary deployment (no editorial acknowledgement)
        if: steps.editorial.outputs.acknowledge == 'false'
        run: echo "Skipped editorial acknowledgement; no new editorial release in this deployment"
