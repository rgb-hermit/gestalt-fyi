name: Build and deploy Astro site

on:
  push:
    branches: [main, astro-proof-of-concept]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "deployment purpose"
        required: true
        type: choice
        default: site
        options:
          - site
          - editorial

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: astro-site/package-lock.json
      - run: npm ci
      - run: npm run test:publishing
      - name: capture queued editorial changes
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'editorial' && github.ref == 'refs/heads/main'
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: node scripts/editorial-release.mjs capture
      - run: npm run build
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      - name: verify queued articles against built site
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'editorial' && github.ref == 'refs/heads/main'
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: node scripts/editorial-release.mjs verify-built
      - name: preserve editorial release record
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'editorial' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: editorial-release-record
          path: astro-site/.release/queued.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: astro-site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  editorial-writeback:
    if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'editorial' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          name: editorial-release-record
          path: astro-site/.release
      - name: acknowledge successfully deployed articles in Notion
        working-directory: astro-site
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: node scripts/editorial-release.mjs acknowledge
