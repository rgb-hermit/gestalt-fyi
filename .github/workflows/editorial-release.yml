name: Editorial release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-release
  cancel-in-progress: false

jobs:
  prepare-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: astro-site/package-lock.json
      - name: verify publishing credentials
        env:
          RELEASE_TOKEN: ${{ secrets.EDITORIAL_RELEASE_TOKEN }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          test -n "$RELEASE_TOKEN" || { echo "::error::EDITORIAL_RELEASE_TOKEN is not configured"; exit 1; }
          test -n "$NOTION_API_TOKEN" || { echo "::error::NOTION_API_TOKEN is not configured"; exit 1; }
      - run: npm ci
        working-directory: astro-site
      - name: capture explicitly queued changes
        working-directory: astro-site
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: node scripts/editorial-release.mjs capture
      - run: npm run test:publishing
        working-directory: astro-site
      - run: npm run build
        working-directory: astro-site
      - name: verify candidate and current Notion state
        working-directory: astro-site
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: node scripts/editorial-release.mjs verify-built
      - name: create snapshot pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.EDITORIAL_RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="editorial/release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add astro-site/src/content/field-guide-approved.json
          git commit -m "chore(publishing): prepare editorial snapshot"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$branch"
          url="$(gh pr create --base main --head "$branch" --title "chore(publishing): approve editorial snapshot" --body "Automatically prepared from explicitly queued Notion publication operations. Build checks must pass before merge.")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: await required checks and merge approved snapshot
        env:
          GH_TOKEN: ${{ secrets.EDITORIAL_RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          set -euo pipefail
          # Newly created PRs may not have a check run yet. Wait for one to appear.
          ready=0
          for attempt in $(seq 1 30); do
            if gh pr checks "${{ steps.pr.outputs.url }}" --required --json name,state --jq 'length' 2>/dev/null | grep -Eq '^[1-9][0-9]*
          cd astro-site
          node scripts/editorial-release.mjs verify-built
          cd ..
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch --subject "chore(publishing): approve editorial snapshot"
; then
              ready=1
              break
            fi
            sleep 10
          done
          if [[ "$ready" != 1 ]]; then
            echo "::error::Required PR checks did not appear within five minutes"
            exit 1
          fi
          gh pr checks "${{ steps.pr.outputs.url }}" --required --watch --fail-fast
          cd astro-site
          node scripts/editorial-release.mjs verify-built
          cd ..
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch --subject "chore(publishing): approve editorial snapshot"
