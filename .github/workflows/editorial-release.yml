name: Prepare editorial snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-snapshot-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: astro-site/package-lock.json
      - run: npm ci
        working-directory: astro-site
      - name: capture explicitly queued editorial changes
        working-directory: astro-site
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: node scripts/editorial-release.mjs capture
      - run: npm run test:publishing
        working-directory: astro-site
      - run: npm run build
        working-directory: astro-site
      - name: verify captured articles against built site and Notion
        working-directory: astro-site
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: node scripts/editorial-release.mjs verify-built
      - name: prepare reviewable branch
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="editorial/release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add astro-site/src/content/field-guide-approved.json
          git commit -m "chore(publishing): prepare editorial snapshot"
          git push origin "HEAD:refs/heads/$branch"
          echo "### Snapshot ready for review" >> "$GITHUB_STEP_SUMMARY"
          echo "Create a pull request from \`$branch\` into \`main\` using the title \`chore(publishing): approve editorial snapshot\`." >> "$GITHUB_STEP_SUMMARY"
          echo "The pull request will trigger the required build check. Merge only after the check passes and the snapshot is reviewed." >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the compare page](https://github.com/${GH_REPO}/compare/main...${branch}?expand=1)" >> "$GITHUB_STEP_SUMMARY"
