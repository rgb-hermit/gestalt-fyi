name: Prepare site copy

on:
  workflow_dispatch:
    inputs:
      page:
        description: Page to import from Notion
        required: true
        type: choice
        options:
          - about
          - home

permissions:
  contents: write

jobs:
  prepare-copy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PAGE: ${{ inputs.page }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Import selected page from Notion
        id: import
        env:
          NOTION_SITE_COPY_TOKEN: ${{ secrets.NOTION_SITE_COPY_TOKEN }}
          NOTION_ABOUT_PAGE_LINK: ${{ secrets.NOTION_ABOUT_PAGE_LINK }}
          NOTION_HOME_PAGE_LINK: ${{ secrets.NOTION_HOME_PAGE_LINK }}
        run: |
          case "$PAGE" in
            about)
              page_link="$NOTION_ABOUT_PAGE_LINK"
              copy_file="astro-site/src/content/about-draft.json"
              ;;
            home)
              page_link="$NOTION_HOME_PAGE_LINK"
              copy_file="astro-site/src/content/home-copy.json"
              ;;
            *)
              echo "Choose about or home."
              exit 1
              ;;
          esac

          if [ -z "$page_link" ]; then
            echo "The Notion page link for $PAGE is missing."
            exit 1
          fi

          node astro-site/scripts/import-about-copy.mjs "$page_link" "$PAGE"
          echo "copy_file=$copy_file" >> "$GITHUB_OUTPUT"

      - name: Prepare copy for review
        env:
          COPY_FILE: ${{ steps.import.outputs.copy_file }}
        run: |
          if git diff --quiet -- "$COPY_FILE"; then
            echo "The $PAGE copy already matches Notion." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="site-copy/${PAGE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$COPY_FILE"
          git commit -m "update $PAGE copy from notion"
          git push origin "$branch"

          echo "[Review the $PAGE copy change](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1)" >> "$GITHUB_STEP_SUMMARY"
